services:
  - type: web
    name: bhurakshak-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: MONGODB_URL
        sync: false        # Set manually in Render dashboard (contains password)
      - key: MONGODB_DATABASE
        value: bhurakshak
      - key: JWT_SECRET
        sync: false        # Set manually in Render dashboard
      - key: CORS_ORIGINS
        sync: false        # Set after Vercel gives you the frontend URL
    healthCheckPath: /
    autoDeploy: true
